
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zloty.kruszyny — Czat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #10131c;
      color: #f5f6fa;
      font-family: Arial, sans-serif;
    }
    main { max-width: 650px; margin: auto; }
    h1 { color: #8b9cff; }
    .panel {
      background: #1b2030;
      padding: 16px;
      border-radius: 14px;
      margin: 14px 0;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border-radius: 9px;
      border: 1px solid #454c60;
      font-size: 16px;
    }
    input { background: #111521; color: white; }
    button {
      background: #687cff;
      color: white;
      border: 0;
      font-weight: bold;
    }
    #messages {
      height: 320px;
      overflow-y: auto;
      background: #111521;
      padding: 12px;
      border-radius: 10px;
    }
    .message {
      padding: 9px;
      margin: 7px 0;
      background: #252c40;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }
    .muted { color: #b4bdd2; font-size: 13px; }
    #chat { display: none; }
  </style>
</head>
<body>
<main>
  <h1>zloty.kruszyny 💬</h1>
  <p class="muted">Prywatny czat dla członków.</p>

  <div class="panel">
    <label for="nickname">Nick</label>
    <input id="nickname" placeholder="Twój nick" maxlength="40">

    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="E-mail">

    <label for="password">Hasło</label>
    <input id="password" type="password"
           placeholder="Minimum 6 znaków">

    <button id="signup">Utwórz konto</button>
    <button id="login">Zaloguj się</button>
    <button id="join" hidden>Dołącz z zaproszenia</button>
    <button id="logout" hidden>Wyloguj się</button>
  </div>

  <div class="panel">
    <strong>Status</strong>
    <p id="status">Łączenie z serwerem...</p>
  </div>

  <section id="chat" class="panel">
    <h2>Wiadomości</h2>
    <div id="messages"></div>
    <form id="sendForm">
      <input id="messageInput" maxlength="2000"
             placeholder="Napisz wiadomość..." required>
      <button type="submit">Wyślij wiadomość</button>
    </form>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://sxlftsumkwmwuuvclgrk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cTv74cTj0cZrfGHYBe8PkQ_wf1OBSHi';

const $ = id => document.getElementById(id);
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let isMember = false;
let channel = null;

function status(text) {
  $('status').textContent = text;
}

function getInviteCode() {
  const params = new URLSearchParams(location.search);
  return params.get('invite') || '';
}

function showMessage(msg) {
  const item = document.createElement('div');
  item.className = 'message';

  const name = document.createElement('strong');
  name.textContent = msg.username || 'Użytkownik';

  const content = document.createElement('div');
  content.textContent = msg.content;

  const time = document.createElement('div');
  time.className = 'muted';
  time.textContent = msg.created_at
    ? new Date(msg.created_at).toLocaleString('pl-PL')
    : '';

  item.append(name, content, time);
  $('messages').appendChild(item);
}

async function refresh() {
  const { data, error } = await db.auth.getSession();
  if (error) {
    status('Błąd sesji: ' + error.message);
    return;
  }

  currentUser = data.session?.user || null;
  $('signup').hidden = !!currentUser;
  $('login').hidden = !!currentUser;
  $('logout').hidden = !currentUser;
  $('join').hidden = true;
  $('chat').style.display = 'none';

  if (channel) {
    await db.removeChannel(channel);
    channel = null;
  }

  if (!currentUser) {
    isMember = false;
    status('Zaloguj się lub utwórz konto.');
    return;
  }

  const { data: member, error: memberError } = await db
    .from('chat_members')
    .select('user_id')
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (memberError) {
    status('Błąd członkostwa: ' + memberError.message);
    return;
  }

  if (!member) {
    isMember = false;
    $('join').hidden = false;
    status('Nie należysz jeszcze do czatu. Użyj zaproszenia.');
    return;
  }

  isMember = true;
  $('chat').style.display = 'block';
  status('Jesteś członkiem zloty.kruszyny!');

  await loadMessages();

  channel = db.channel('chat-messages')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'messages'
    }, payload => {
      if (payload.new) {
        showMessage(payload.new);
        $('messages').scrollTop = $('messages').scrollHeight;
      }
    })
    .subscribe();
}

async function loadMessages() {
  const { data, error } = await db
    .from('messages')
    .select('*')
    .order('created_at', { ascending: true })
    .limit(200);

  if (error) {
    status('Błąd wiadomości: ' + error.message);
    return;
  }

  $('messages').replaceChildren();
  (data || []).forEach(showMessage);
  $('messages').scrollTop = $('messages').scrollHeight;
}

$('signup').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  const nickname = $('nickname').value.trim() || 'Użytkownik';

  if (!email || password.length < 6) {
    status('Wpisz e-mail i hasło mające co najmniej 6 znaków.');
    return;
  }

  status('Tworzenie konta...');

  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: { data: { nickname } }
  });

  if (error) {
    status('Błąd rejestracji: ' + error.message);
    return;
  }

  if (!data.session) {
    status('Konto utworzone! Potwierdź e-mail, a potem się zaloguj.');
  } else {
    status('Konto utworzone!');
    await refresh();
  }
};

$('login').onclick = async () => {
  status('Logowanie...');

  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });

  if (error) {
    status('Błąd logowania: ' + error.message);
    return;
  }

  await refresh();
};

$('logout').onclick = async () => {
  const { error } = await db.auth.signOut();
  if (error) {
    status('Błąd wylogowania: ' + error.message);
    return;
  }
  await refresh();
};

$('join').onclick = async () => {
  if (!currentUser) {
    status('Najpierw się zaloguj.');
    return;
  }

  const code = getInviteCode();
  if (!code) {
    status('Brak kodu zaproszenia w adresie strony (?invite=KOD).');
    return;
  }

  status('Sprawdzanie zaproszenia...');

  const { data, error } = await db.rpc('redeem_chat_invite', {
    invite_code: code
  });

  if (error) {
    status('Błąd zaproszenia: ' + error.message);
    return;
  }

  if (data !== true) {
    status('Zaproszenie nieprawidłowe lub wygasło.');
    return;
  }

  status('Dołączono do czatu!');
  await refresh();
};

$('sendForm').onsubmit = async event => {
  event.preventDefault();

  const content = $('messageInput').value.trim();
  if (!content || !currentUser || !isMember) return;

  const username = (
    currentUser.user_metadata?.nickname ||
    currentUser.email?.split('@')[0] ||
    'Użytkownik'
  ).slice(0, 40);

  const { error } = await db.from('messages').insert({
    user_id: currentUser.id,
    username,
    content
  });

  if (error) {
    status('Błąd wysyłania: ' + error.message);
    return;
  }

  $('messageInput').value = '';
  status('Wiadomość wysłana!');
};

db.auth.onAuthStateChange(() => {
  setTimeout(refresh, 0);
});

refresh();
</script>
</body>
</html>
