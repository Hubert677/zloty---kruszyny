<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zloty.kruszyny</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090d;
      color: white;
    }
    .app {
      max-width: 650px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px;
      background: #15151d;
      border-bottom: 1px solid #292936;
    }
    h1 { margin: 0; font-size: 23px; }
    header p { color: #a5a5b5; margin-bottom: 0; }
    #login, #chat { padding: 20px; }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border-radius: 9px;
      border: 1px solid #353543;
      font-size: 16px;
    }
    input { background: #171720; color: white; }
    button {
      background: #7357ff;
      color: white;
      border: 0;
      font-weight: bold;
    }
    button:disabled { opacity: .5; }
    #status { color: #b7b7c8; }
    #messages {
      flex: 1;
      min-height: 250px;
      padding: 12px;
      overflow-y: auto;
      background: #111119;
      border-radius: 12px;
    }
    .message {
      padding: 10px;
      margin: 8px 0;
      background: #20202c;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    .name { color: #a998ff; font-weight: bold; }
    .time { color: #9292a3; font-size: 11px; }
    .hidden { display: none !important; }
    .note { color: #b6b6c6; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>🖤 zloty.kruszyny</h1>
    <p>Prywatny czat twojej ekipy</p>
  </header>

  <section id="login">
    <h2>Witaj w ekipie!</h2>
    <input id="email" type="email" placeholder="Adres e-mail">
    <input id="password" type="password" placeholder="Hasło (min. 8 znaków)">
    <input id="nickname" maxlength="24" placeholder="Twój nick">
    <button id="register">Utwórz konto</button>
    <button id="signin">Zaloguj się</button>
    <p id="status" role="status">Zaloguj się lub utwórz konto.</p>
    <p class="note">Do prywatnego pokoju będzie można wejść po skonfigurowaniu zaproszeń.</p>
  </section>

  <section id="chat" class="hidden">
    <p id="welcome"></p>
    <div id="messages"></div>
    <form id="sendForm">
      <input id="content" maxlength="2000" placeholder="Napisz wiadomość..." required>
      <button type="submit">Wyślij 💬</button>
    </form>
    <button id="logout">Wyloguj się</button>
    <p id="chatStatus" class="note"></p>
  </section>
</div>

    $('status').textContent = text;
